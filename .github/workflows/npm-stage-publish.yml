name: npm stage publish OIDC test

on:
  workflow_dispatch:
    inputs:
      package:
        description: Existing public npm package with this trusted publisher configured
        required: true
        type: string
      expected_npm_user:
        description: npm username expected in the package maintainer list
        required: true
        type: string
      registry:
        description: Registry under test
        required: true
        type: string
        default: https://registry.npmjs.org/
      cli_ref:
        description: npm/cli branch, tag, or commit SHA
        required: true
        type: string
        default: latest
      version:
        description: Unique package version to stage
        required: true
        type: string
      tag:
        description: Non-latest staged publish tag
        required: true
        type: string
        default: oidc-smoke
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      expected_npm_user:
        required: false
        type: string
      registry:
        required: true
        type: string
      cli_ref:
        required: false
        type: string
        default: latest
      version:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  stage-publish:
    name: npm stage publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_NPM_USER: ${{ inputs.expected_npm_user }}
      FIXTURE_DIR: ${{ github.workspace }}/.tmp/npm-oidc-fixture
      NPM_CLI: ${{ github.workspace }}/.tmp/npm-cli/bin/npm-cli.js
      OPERATION: stage-publish
      PACKAGE_NAME: ${{ inputs.package }}
      PUBLISH_VERSION: ''
      REGISTRY: ${{ inputs.registry }}
      STAGE_VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}

    steps:
      - name: Check out smoke test
        uses: actions/checkout@v6

      - name: Check out npm CLI
        uses: actions/checkout@v6
        with:
          repository: npm/cli
          ref: ${{ inputs.cli_ref }}
          path: .tmp/npm-cli

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Validate inputs
        run: node scripts/validate-inputs.mjs

      - name: Install npm CLI dependencies
        working-directory: .tmp/npm-cli
        run: npm ci

      - name: Show CLI under test
        run: node "$NPM_CLI" --version

      - name: Verify package and npm user
        if: inputs.expected_npm_user != ''
        run: |
          maintainers_file="$RUNNER_TEMP/npm-maintainers.json"
          node "$NPM_CLI" view "$PACKAGE_NAME" maintainers --json --registry="$REGISTRY" > "$maintainers_file"
          node scripts/verify-maintainer.mjs "$maintainers_file" "$EXPECTED_NPM_USER"

      - name: Prepare package
        run: PACKAGE_VERSION="$STAGE_VERSION" node scripts/prepare-package.mjs

      - name: Stage package
        run: node "$NPM_CLI" stage publish "$FIXTURE_DIR" --access=public --tag="$TAG" --registry="$REGISTRY"
